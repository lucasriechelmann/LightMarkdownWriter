# Builds a release when a version tag is pushed (git tag -a v1.2.0 && git push origin v1.2.0):
# tests, the portable exe, the installer, SHA256SUMS.txt, build provenance attestations, and a DRAFT GitHub
# release with all three files. Review the notes on GitHub, then publish the draft; the website's
# /releases/latest/download/... links only follow published releases.
#
# The tag decides the version: it's stamped into the csproj on the runner, so a forgotten <Version> bump
# only gives a warning. To rebuild an existing tag (without moving it): Actions → Release → Run workflow.
name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: 'Existing tag to build, e.g. v1.2.0'
        required: true

permissions:
  contents: write      # create the release
  id-token: write      # sign the attestation
  attestations: write  # store the attestation

jobs:
  release:
    runs-on: windows-latest
    env:
      TAG: ${{ inputs.tag || github.ref_name }}   # via env, never pasted into scripts
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.ref }}  # a manual run builds the tagged commit, not main

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Take the version from the tag
        shell: pwsh
        run: |
          if ($env:TAG -notmatch '^v(\d+\.\d+\.\d+)$') { throw "Tag '$env:TAG' isn't vMAJOR.MINOR.PATCH." }
          $version = $Matches[1]
          $project = 'src/LightMarkdownWriter/LightMarkdownWriter.csproj'
          $xml = [xml](Get-Content $project -Raw)
          $node = $xml.SelectSingleNode('/Project/PropertyGroup/Version')
          if ($node.InnerText -ne $version) {
            Write-Output "::warning::<Version> in the csproj is $($node.InnerText); building $version from the tag. Bump it in the repo too."
            $node.InnerText = $version
            $xml.Save((Resolve-Path $project))  # the runner's copy only; the app and the installer both read it
          }
          "Building $version"

      - name: Test
        run: dotnet test -c Release

      - name: Portable exe (framework-dependent)
        run: dotnet publish src/LightMarkdownWriter -p:PublishProfile=win-x64

      - name: Install Inno Setup 6
        run: choco install innosetup --no-progress -y

      - name: Installer (self-contained)
        shell: pwsh
        run: ./installer/build-installer.ps1

      - name: SHA256SUMS.txt
        shell: pwsh
        run: |
          $files = 'artifacts/publish/LightMarkdownWriter.exe', 'artifacts/installer/LightMarkdownWriter-Setup.exe'
          $lines = foreach ($file in $files) {
            '{0}  {1}' -f (Get-FileHash $file -Algorithm SHA256).Hash.ToLowerInvariant(), (Split-Path $file -Leaf)
          }
          ($lines -join "`n") + "`n" | Set-Content artifacts/SHA256SUMS.txt -Encoding ascii -NoNewline
          Get-Content artifacts/SHA256SUMS.txt

      # Lets anyone check the files were built here from this commit: gh attestation verify <file> -R <owner/repo>
      - uses: actions/attest-build-provenance@v2
        with:
          subject-path: |
            artifacts/publish/LightMarkdownWriter.exe
            artifacts/installer/LightMarkdownWriter-Setup.exe

      - name: Draft GitHub release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create $env:TAG `
            artifacts/publish/LightMarkdownWriter.exe `
            artifacts/installer/LightMarkdownWriter-Setup.exe `
            artifacts/SHA256SUMS.txt `
            --title "LightMarkdownWriter $env:TAG" --generate-notes --draft --verify-tag
